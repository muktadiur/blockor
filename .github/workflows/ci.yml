name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint sh scripts
        run: |
          shellcheck -x -P SCRIPTDIR -s sh \
            usr/local/bin/blockor \
            usr/local/libexec/blockor/blockord.sh \
            usr/local/libexec/blockor/blockor.subr \
            tests/run_tests.sh \
            freebsd/usr/local/etc/rc.d/blockord
      - name: Lint OpenBSD ksh rc script
        run: shellcheck -x -P SCRIPTDIR openbsd/etc/rc.d/blockord

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test harness
        run: sh tests/run_tests.sh
