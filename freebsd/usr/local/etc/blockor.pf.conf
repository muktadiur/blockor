# blockor PF rules.
#
# Pull these into your firewall by adding ONE line to /etc/pf.conf, near the
# TOP of your filter rules (before any "pass" rules, so the quick block wins):
#
#     include "/usr/local/etc/blockor.pf.conf"
#
# then reload PF:
#
#     pfctl -f /etc/pf.conf
#
# <blockor> holds the addresses blockor has blocked; the rule drops their
# inbound traffic on the external (egress) interface.

table <blockor> persist
block drop in quick on egress from <blockor> to any
