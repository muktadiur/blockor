# blockor.conf - FreeBSD
#
# This file is sourced as /bin/sh. Keep it root-owned and not group/world
# writable (blockor refuses to run otherwise).

# --- paths (usually leave as-is) ---
blockord="/usr/local/libexec/blockor/blockord.sh"
blockor="/usr/local/bin/blockor"
blockor_subr="/usr/local/libexec/blockor/blockor.subr"
db_dir="/var/db/blockor"            # persistent state (bans, failures)
run_dir="/var/run/blockor"          # pid file and fifo
blockor_log_file="/var/log/blockord.log"

# --- log source(s) to watch ---
auth_file="/var/log/auth.log"       # FreeBSD default
# Watch several logs at once (overrides auth_file when set):
# auth_files="/var/log/auth.log /var/log/maillog"

# --- detection ---
# Pattern(s) that mark a failed attempt, separated by | (extended regex).
search_pattern="PAM: Authentication error|Failed password|Invalid user|Unable to negotiate with|Bad protocol version identification|Disconnected from authenticating user root"
max_tolerance=10        # ban after this many failures within findtime
findtime=600            # sliding window in seconds (10 minutes)
bantime=3600            # ban duration in seconds; 0 = permanent
expire_interval=60      # how often (seconds) expired bans are released

# --- whitelist ---
# IPs and/or CIDR ranges (IPv4 and IPv6), space separated. Never blocked.
blockor_whitelist=""

# --- notifications (all optional) ---
notify_syslog="YES"     # log bans/unbans via logger(1)
notify_email=""         # email address; requires mail(1)
notify_command=""       # external hook, called as: cmd <ban|unban> <ip> <count>
