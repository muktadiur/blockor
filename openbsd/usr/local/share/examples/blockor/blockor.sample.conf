# blockor.conf sample - OpenBSD
#
# Copy to /usr/local/etc/blockor.conf and edit. Sourced as /bin/sh; keep it
# root-owned and not group/world writable.

# --- paths (usually leave as-is) ---
blockord="/usr/local/libexec/blockor/blockord.sh"
blockor="/usr/local/bin/blockor"
blockor_subr="/usr/local/libexec/blockor/blockor.subr"
blockor_sample_conf="/usr/local/share/examples/blockor/blockor.sample.conf"
db_dir="/var/db/blockor"
run_dir="/var/run/blockor"
blockor_log_file="/var/log/blockord.log"

# --- log source(s) to watch ---
auth_file="/var/log/authlog"
# auth_files="/var/log/authlog /var/log/maillog"

# --- detection ---
search_pattern="PAM: Authentication error|Failed password|Invalid user|Unable to negotiate with|Bad protocol version identification|Disconnected from authenticating user root"
max_tolerance=10        # ban after this many failures within findtime
findtime=600            # sliding window in seconds
bantime=3600            # ban duration in seconds; 0 = permanent
expire_interval=60      # how often (seconds) expired bans are released

# --- whitelist (IPs and/or CIDR, v4 and v6) ---
blockor_whitelist="192.168.56.20 192.168.56.102 10.0.0.0/8 2001:db8::/32"

# --- notifications (all optional) ---
notify_syslog="YES"
notify_email=""
notify_command=""
